<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Notelet — แชทกับเจ้าของ</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" />
  <script src="/js/config.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/chat-notifications.js"></script>
  <style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --navy:    #043873;
  --navy2:   #0a5ba8;
  --blue:    #4F9CF9;
  --green:   #22c55e;
  --red:     #ef4444;
  --yellow:  #f59e0b;
  --text:    #1e2d4a;
  --muted:   #6b7280;
  --surface: rgba(255 255 255 / 0.97);
  --border:  rgba(4 56 115 / 0.12);
  --radius:  16px;
  --shadow:  0 20px 48px rgba(0 0 0 / 0.18);
}

html, body {
  height: 100%;
  font-family: 'Inter', sans-serif;
  background: linear-gradient(135deg, var(--navy) 0%, var(--navy2) 100%);
  min-height: 100vh;
  overflow: hidden;
}

/* ─── Shell ── two-column: left device info, right chat ─── */
.shell {
  display: grid;
  grid-template-columns: 280px 1fr;
  height: 100vh;
  max-width: 1100px;
  margin: 0 auto;
  padding: 16px;
  gap: 12px;
}
@media (max-width: 700px) {
  .shell { grid-template-columns: 1fr; padding: 8px; gap: 8px; height: auto; min-height: 100vh; overflow: auto; }
  .left-panel { display: none; }
  html, body { overflow: auto; }
}

/* ─── Glass panel ─── */
.glass {
  background: var(--surface);
  backdrop-filter: blur(24px) saturate(180%);
  border: 1px solid rgba(255 255 255 / 0.45);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  overflow: hidden;
}

/* ─── LEFT PANEL ─── */
.left-panel { display: flex; flex-direction: column; overflow: hidden; }

.back-nav {
  padding: 14px 16px 10px;
  border-bottom: 1px solid var(--border);
  flex-shrink: 0;
}
.back-btn {
  display: flex; align-items: center; gap: 6px;
  background: none; border: none; cursor: pointer;
  color: var(--navy); font-size: 13px; font-weight: 600;
  padding: 6px 10px; border-radius: 8px;
  transition: background .15s;
}
.back-btn:hover { background: rgba(4 56 115 / 0.08); }

.device-card { padding: 16px; }
.device-img {
  width: 100%; height: 160px; border-radius: 12px;
  background: linear-gradient(135deg, #e8eef8, #ccdaf0);
  display: flex; align-items: center; justify-content: center;
  font-size: 48px; margin-bottom: 14px; overflow: hidden;
}
.device-img img { width: 100%; height: 100%; object-fit: cover; border-radius: 12px; }
.device-name { font-size: 16px; font-weight: 700; color: var(--text); margin-bottom: 4px; }
.device-type { font-size: 12px; color: var(--muted); margin-bottom: 14px; }

.owner-row {
  display: flex; align-items: center; gap: 10px;
  background: rgba(4 56 115 / 0.04);
  border: 1px solid var(--border);
  border-radius: 10px; padding: 10px 12px;
}
.owner-av {
  width: 36px; height: 36px; border-radius: 50%;
  background: linear-gradient(135deg, var(--navy), var(--navy2));
  display: flex; align-items: center; justify-content: center;
  font-size: 13px; font-weight: 700; color: #fff; flex-shrink: 0;
}
.owner-info { flex: 1; min-width: 0; }
.owner-name { font-size: 13px; font-weight: 600; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.owner-label { font-size: 11px; color: var(--muted); }

.divider { height: 1px; background: var(--border); margin: 14px 0; }

.tip-box {
  margin: 0 16px 16px;
  background: rgba(79 156 249 / 0.08);
  border: 1px solid rgba(79 156 249 / 0.2);
  border-radius: 10px; padding: 10px 12px;
  font-size: 12px; color: var(--muted); line-height: 1.6;
}
.tip-box strong { color: var(--navy); }

/* ─── MAIN CHAT ─── */
.chat-main { display: flex; flex-direction: column; overflow: hidden; }

.chat-header {
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  display: flex; align-items: center; gap: 12px;
  flex-shrink: 0;
}
.chat-icon {
  width: 40px; height: 40px; border-radius: 12px;
  background: linear-gradient(135deg, var(--navy), var(--navy2));
  display: flex; align-items: center; justify-content: center;
  font-size: 18px; flex-shrink: 0;
}
.chat-header-info h2 { font-size: 15px; font-weight: 700; color: var(--text); }
.chat-header-info p  { font-size: 12px; color: var(--muted); margin-top: 1px; }
.conn-wrap { margin-left: auto; display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
.conn-dot { width: 8px; height: 8px; border-radius: 50%; background: #d1d5db; transition: background .3s; }
.conn-dot.connected    { background: var(--green); box-shadow: 0 0 6px var(--green); }
.conn-dot.connecting   { background: var(--yellow); animation: blink 1s ease-in-out infinite; }
.conn-dot.disconnected { background: var(--red); }
@keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: .3; } }

/* Message feed */
.msg-feed {
  flex: 1; overflow-y: auto;
  padding: 18px 20px;
  display: flex; flex-direction: column; gap: 2px;
  scroll-behavior: smooth;
  scrollbar-width: thin; scrollbar-color: rgba(4 56 115 / 0.2) transparent;
}
::-webkit-scrollbar { width: 5px; }
::-webkit-scrollbar-thumb { background: rgba(4 56 115 / 0.2); border-radius: 10px; }

.date-sep {
  display: flex; align-items: center; gap: 10px;
  margin: 12px 0 8px; font-size: 11px; font-weight: 600;
  color: var(--muted); text-transform: uppercase; letter-spacing: .06em;
}
.date-sep::before, .date-sep::after { content: ''; flex: 1; height: 1px; background: var(--border); }

/* Chat rows */
.msg-row {
  display: flex; align-items: flex-end; gap: 8px;
  max-width: 80%; animation: msgIn .2s ease-out;
}
@keyframes msgIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: translateY(0); } }
.msg-row.own { align-self: flex-end; flex-direction: row-reverse; }
.msg-row.consecutive .msg-av   { visibility: hidden; }
.msg-row.consecutive .msg-meta { display: none; }

.msg-av {
  width: 32px; height: 32px; border-radius: 50%;
  background: linear-gradient(135deg, var(--navy), var(--navy2));
  display: flex; align-items: center; justify-content: center;
  font-size: 12px; font-weight: 700; color: #fff; flex-shrink: 0;
}
.msg-group { display: flex; flex-direction: column; gap: 2px; max-width: 100%; }
.msg-meta { display: flex; align-items: baseline; gap: 6px; padding: 0 10px; font-size: 11px; }
.msg-row.own .msg-meta { justify-content: flex-end; }
.msg-name { font-weight: 600; color: var(--text); }
.msg-time { color: var(--muted); }

.bubble {
  padding: 9px 14px; border-radius: 16px;
  font-size: 14px; line-height: 1.55; color: var(--text);
  background: rgba(255 255 255 / 0.7); border: 1px solid rgba(255 255 255 / 0.6);
  word-break: break-word; max-width: 420px;
}
.msg-row.own .bubble {
  background: linear-gradient(135deg, var(--navy), var(--navy2));
  color: #fff; border-color: transparent;
}

.bubble-img {
  max-width: 240px; border-radius: 12px; overflow: hidden; cursor: zoom-in;
  border: 1px solid rgba(255 255 255 / 0.6);
}
.bubble-img img { width: 100%; display: block; }

.sys-text {
  align-self: center; font-size: 12px; color: var(--muted);
  background: rgba(4 56 115 / 0.05); border-radius: 999px;
  padding: 4px 14px; margin: 6px 0;
}

/* Typing bar */
.typing-bar { padding: 4px 20px; font-size: 12px; color: var(--muted); height: 22px; font-style: italic; flex-shrink: 0; }
.t-dots { display: inline-flex; gap: 3px; vertical-align: middle; margin-left: 4px; }
.t-dots span { width: 4px; height: 4px; border-radius: 50%; background: var(--muted); animation: td 1.2s ease-in-out infinite; }
.t-dots span:nth-child(2) { animation-delay: .2s; }
.t-dots span:nth-child(3) { animation-delay: .4s; }
@keyframes td { 0%, 60%, 100% { transform: translateY(0); } 30% { transform: translateY(-4px); } }

/* Input area */
.input-area { padding: 12px 16px 14px; border-top: 1px solid var(--border); flex-shrink: 0; }
.input-toolbar { display: flex; gap: 6px; margin-bottom: 8px; }
.tool-btn {
  width: 32px; height: 32px; border-radius: 8px; border: 1.5px solid var(--border);
  background: rgba(4 56 115 / 0.03); cursor: pointer; font-size: 16px;
  display: flex; align-items: center; justify-content: center;
  color: var(--muted); transition: background .15s, color .15s;
}
.tool-btn:hover { background: rgba(4 56 115 / 0.1); color: var(--navy); }
#dc_imgInput { display: none; }

.input-wrap {
  display: flex; align-items: flex-end; gap: 8px;
  background: rgba(4 56 115 / 0.04); border: 1.5px solid rgba(4 56 115 / 0.15);
  border-radius: 14px; padding: 8px 12px;
  transition: border-color .2s, box-shadow .2s;
}
.input-wrap:focus-within { border-color: var(--navy); box-shadow: 0 0 0 3px rgba(4 56 115 / 0.1); }
#dc_chatInput {
  flex: 1; background: transparent; border: none; outline: none;
  font-family: 'Inter', sans-serif; font-size: 14px; color: var(--text);
  resize: none; max-height: 100px; line-height: 1.5;
}
#dc_chatInput::placeholder { color: var(--muted); }
.send-btn {
  width: 36px; height: 36px; border-radius: 10px; flex-shrink: 0;
  background: linear-gradient(135deg, var(--navy), var(--navy2));
  border: none; cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  transition: opacity .2s, transform .15s;
  box-shadow: 0 3px 10px rgba(4 56 115 / 0.38);
}
.send-btn:hover:not(:disabled) { transform: scale(1.06); }
.send-btn:disabled { opacity: .4; cursor: not-allowed; }
.send-btn svg { width: 16px; height: 16px; fill: #fff; }

/* Rent CTA */
.rent-cta {
  margin: 14px 16px 0;
  padding: 12px 16px;
  background: linear-gradient(135deg, var(--navy), var(--navy2));
  border-radius: 12px; border: none; cursor: pointer;
  color: #fff; font-size: 14px; font-weight: 700; width: calc(100% - 32px);
  transition: opacity .2s;
}
.rent-cta:hover { opacity: .88; }

/* Lightbox */
#dc_lightbox {
  display: none; position: fixed; inset: 0;
  background: rgba(0,0,0,.9); z-index: 9999;
  align-items: center; justify-content: center;
}
#dc_lightbox.open { display: flex; }
#dc_lightbox img { max-width: 88vw; max-height: 88vh; border-radius: 10px; }
#dc_lightbox .lb-close {
  position: absolute; top: 16px; right: 20px;
  background: rgba(255,255,255,.12); border: none; color: #fff;
  font-size: 22px; cursor: pointer; border-radius: 50%;
  width: 40px; height: 40px; display: flex; align-items: center; justify-content: center;
}
  </style>
</head>
<body>

<div id="dc_lightbox">
  <button class="lb-close" onclick="document.getElementById('dc_lightbox').classList.remove('open')">×</button>
  <img id="dc_lbImg" src="" alt="image">
</div>

<div class="shell">
  <!-- LEFT: device info -->
  <div class="left-panel glass">
    <div class="back-nav">
      <button class="back-btn" id="dc_backBtn">← กลับ</button>
    </div>
    <div class="device-card">
      <div class="device-img" id="dc_deviceImg">📦</div>
      <div class="device-name" id="dc_deviceName">อุปกรณ์</div>
      <div class="device-type" id="dc_deviceType">ประเภทอุปกรณ์</div>
      <div class="owner-row">
        <div class="owner-av" id="dc_ownerAv">?</div>
        <div class="owner-info">
          <div class="owner-name" id="dc_ownerName">เจ้าของ</div>
          <div class="owner-label">เจ้าของอุปกรณ์</div>
        </div>
      </div>
    </div>
    <div class="divider"></div>
    <div class="tip-box">
      <strong>💬 แชทโดยตรง</strong><br>
      คุยกับเจ้าของก่อนตัดสินใจเช่า<br>
      พร้อมส่งรูปและไฟล์แนบได้เลย
    </div>
    <button class="rent-cta" id="dc_rentBtn">📋 ยื่นคำขอเช่า / เจรจาต่อ</button>
  </div>

  <!-- RIGHT: chat -->
  <div class="chat-main glass">
    <div class="chat-header">
      <div class="chat-icon">💬</div>
      <div class="chat-header-info">
        <h2 id="dc_chatTitle">กำลังเชื่อมต่อ…</h2>
        <p id="dc_chatSub"></p>
      </div>
      <div class="conn-wrap">
        <div class="conn-dot" id="dc_connDot"></div>
        <span id="dc_connLabel">กำลังเชื่อมต่อ</span>
      </div>
    </div>

    <div class="msg-feed" id="dc_msgFeed">
      <div class="sys-text">กำลังโหลดประวัติแชท…</div>
    </div>

    <div class="typing-bar" id="dc_typingBar"></div>

    <div class="input-area">
      <div class="input-toolbar">
        <label class="tool-btn" title="ส่งรูป" for="dc_imgInput">🖼</label>
        <input type="file" id="dc_imgInput" accept="image/*" multiple>
      </div>
      <div class="input-wrap">
        <textarea id="dc_chatInput" rows="1" placeholder="พิมพ์ข้อความ…" disabled></textarea>
        <button class="send-btn" id="dc_sendBtn" disabled title="ส่ง">
          <svg viewBox="0 0 24 24"><path d="M2 21l21-9L2 3v7l15 2-15 2z"/></svg>
        </button>
      </div>
    </div>
  </div>
</div>

<script>
'use strict';

/* ─── Query params ─── */
const QP         = Object.fromEntries(new URLSearchParams(location.search));
const deviceId   = parseInt(QP.deviceId)  || 0;
const deviceName = decodeURIComponent(QP.deviceName  || 'อุปกรณ์');
const ownerName  = decodeURIComponent(QP.ownerName   || 'เจ้าของ');
const deviceImg  = QP.deviceImg ? decodeURIComponent(QP.deviceImg) : '';
const deviceType = decodeURIComponent(QP.deviceType  || '');
const pricePerDay = parseFloat(QP.pricePerDay) || 0;

/* ─── Auth ─── */
function getAuth() {
  const token = localStorage.getItem('access_token');
  if (!token) return null;
  try {
    const seg = token.split('.')[1].replace(/-/g,'+').replace(/_/g,'/');
    const p = JSON.parse(atob(seg + '=='.slice(0,(4-seg.length%4)%4)));
    if (p.exp * 1000 < Date.now()) return null;
    return { userId: p.user_id, email: p.email, name: p.name || p.email.split('@')[0], token };
  } catch { return null; }
}
const user = getAuth();
if (!user) {
  window.location.href = '/features/auth/login.html?next=' + encodeURIComponent(location.href);
}

/* ─── State ─── */
let ws = null, wsRoom = '';
let reconnectTimer = null, reconnectDelay = 1000;
const typingPeers = new Map();
let typingTimer = null, isTyping = false;
let lastSenderId = null, lastDateLabel = '';

/* ─── Helpers ─── */
function esc(s) { return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function initials(n) { if (!n) return '?'; const p = n.trim().split(/\s+/); return (p.length >= 2 ? p[0][0]+p[1][0] : n[0]).toUpperCase(); }
function fmtTime(d) { return d.toLocaleTimeString('th-TH', { hour:'2-digit', minute:'2-digit' }); }
function fmtDateLabel(d) { return d.toLocaleDateString('th-TH', { year:'numeric', month:'long', day:'numeric' }); }
function sameDay(a, b) { return a.getFullYear()===b.getFullYear() && a.getMonth()===b.getMonth() && a.getDate()===b.getDate(); }

/* ─── DOM init ─── */
document.getElementById('dc_deviceName').textContent = deviceName;
document.getElementById('dc_deviceType').textContent = deviceType;
document.getElementById('dc_ownerName').textContent  = ownerName;
document.getElementById('dc_ownerAv').textContent    = initials(ownerName);
document.getElementById('dc_chatTitle').textContent  = deviceName;
document.getElementById('dc_chatSub').textContent    = 'แชทกับ ' + ownerName;
document.title = 'แชท — ' + deviceName;

if (deviceImg) {
  const imgEl = document.getElementById('dc_deviceImg');
  imgEl.innerHTML = `<img src="${esc(deviceImg)}" alt="device">`;
}

/* Back button */
document.getElementById('dc_backBtn').addEventListener('click', () => {
  if (document.referrer) history.back();
  else window.location.href = '/features/devices/rentdevice.html?id=' + encodeURIComponent(deviceId);
});

/* Rent CTA */
document.getElementById('dc_rentBtn').addEventListener('click', () => {
  const p = new URLSearchParams({
    deviceId:    deviceId,
    deviceName:  deviceName,
    ownerName:   ownerName,
    pricePerDay: pricePerDay,
    deviceType:  deviceType,
    deviceImg:   deviceImg,
  });
  window.location.href = '/features/devices/rentdevice.html?id=' + encodeURIComponent(deviceId) +
    '&name=' + encodeURIComponent(deviceName);
});

/* ─── Connection UI ─── */
function setConn(state, label) {
  const dot = document.getElementById('dc_connDot');
  const lbl = document.getElementById('dc_connLabel');
  dot.className = 'conn-dot ' + state;
  lbl.textContent = label;
}

/* ─── Enable/disable input ─── */
function enableInput(on) {
  document.getElementById('dc_chatInput').disabled = !on;
  document.getElementById('dc_sendBtn').disabled   = !on;
}

/* ─── Open chat room via API, then connect WS ─── */
async function openChat() {
  try {
    const res = await fetch('/api/chat/device-room', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': 'Bearer ' + user.token },
      body: JSON.stringify({ deviceId }),
    });
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const data = await res.json();
    if (!data.roomName) throw new Error('no room');
    wsRoom = data.roomName;
    document.getElementById('dc_chatSub').textContent = 'แชทกับ ' + ownerName + ' · ห้อง ' + data.roomName;
    connectWS(data.roomName);
  } catch (e) {
    // fallback offline room
    wsRoom = 'dev-' + deviceId + '-u-' + (user.userId || 0);
    connectWS(wsRoom);
    enableInput(true);
    appendSys('⚠️ ไม่สามารถเชื่อมต่อเซิร์ฟเวอร์แชทได้');
  }
}

/* ─── WebSocket ─── */
function connectWS(room) {
  setConn('connecting', 'กำลังเชื่อมต่อ...');
  clearTimeout(reconnectTimer);

  let apiBase = (window.NOTELET_API_URL && window.NOTELET_API_URL !== '')
    ? window.NOTELET_API_URL
    : 'https://noteletwebapi-production.up.railway.app';
  if (!window.NOTELET_API_URL &&
      (location.hostname === 'localhost' || location.hostname === '127.0.0.1')) {
    apiBase = 'http://localhost:3001';
  }
  const proto = apiBase.startsWith('https') ? 'wss' : 'ws';
  const host  = apiBase.replace(/^https?:\/\//, '');
  ws = new WebSocket(`${proto}://${host}/api/chat/ws?token=${encodeURIComponent(user.token)}&room=${encodeURIComponent(room)}`);

  ws.onopen = () => {
    reconnectDelay = 1000;
    setConn('connected', 'เชื่อมต่อแล้ว');
    enableInput(true);
    ws.send(JSON.stringify({ type: 'history', roomId: room }));
  };

  ws.onerror = () => setConn('disconnected', 'ข้อผิดพลาด');

  ws.onclose = () => {
    setConn('disconnected', 'ขาดการเชื่อมต่อ');
    reconnectTimer = setTimeout(() => connectWS(room), reconnectDelay);
    reconnectDelay = Math.min(reconnectDelay * 2, 30000);
  };

  ws.onmessage = (e) => {
    try {
      const msg = JSON.parse(e.data);
      if (msg.type === 'history') { onHistory(msg); return; }
      if (msg.type === 'typing')  { onTyping(msg); return; }
      if (msg.type === 'chat' || msg.type === 'message') {
        appendMsg(msg, false);
      }
    } catch (_) {}
  };
}

function wsSend(obj) { if (ws && ws.readyState === WebSocket.OPEN) ws.send(JSON.stringify(obj)); }

/* ─── History ─── */
function onHistory({ history }) {
  const feed = document.getElementById('dc_msgFeed');
  feed.innerHTML = '';
  lastSenderId = null; lastDateLabel = '';
  if (!Array.isArray(history) || history.length === 0) {
    appendSys('ยังไม่มีข้อความ — เริ่มต้นบทสนทนาได้เลย!');
    return;
  }
  history.forEach(m => appendMsg(m, true));
  scrollBottom();
}

/* ─── Typing ─── */
function onTyping(msg) {
  if (!msg.userId || msg.userId === user.userId) return;
  if (msg.isTyping) typingPeers.set(msg.userId, msg.name || '...');
  else typingPeers.delete(msg.userId);
  renderTyping();
}
function renderTyping() {
  const bar = document.getElementById('dc_typingBar');
  if (typingPeers.size === 0) { bar.innerHTML = ''; return; }
  const name = [...typingPeers.values()][0];
  bar.innerHTML = `${esc(name)} กำลังพิมพ์ <span class="t-dots"><span></span><span></span><span></span></span>`;
}
function startTyping() {
  if (!isTyping) { isTyping = true; wsSend({ type: 'typing', roomId: wsRoom, isTyping: true }); }
  clearTimeout(typingTimer);
  typingTimer = setTimeout(stopTyping, 2500);
}
function stopTyping() {
  if (isTyping) { isTyping = false; wsSend({ type: 'typing', roomId: wsRoom, isTyping: false }); }
}

/* ─── Render messages ─── */
function appendMsg(msg, bulk = false) {
  const feed = document.getElementById('dc_msgFeed');
  const isMine = msg.userId === user.userId || msg.senderId === user.userId;
  const senderId = msg.userId || msg.senderId || 0;
  const senderName = msg.name || msg.senderName || (isMine ? (user.name || 'ฉัน') : ownerName);
  const ts = msg.timestamp ? new Date(msg.timestamp) : new Date();
  const timeStr = fmtTime(ts);
  const dateLabel = fmtDateLabel(ts);

  // Date separator
  if (dateLabel !== lastDateLabel) {
    const sep = document.createElement('div');
    sep.className = 'date-sep';
    sep.textContent = dateLabel;
    feed.appendChild(sep);
    lastDateLabel = dateLabel;
    lastSenderId = null;
  }

  const consecutive = senderId === lastSenderId;
  lastSenderId = senderId;

  const row = document.createElement('div');
  row.className = 'msg-row' + (isMine ? ' own' : '') + (consecutive ? ' consecutive' : '');

  // Avatar
  const av = document.createElement('div');
  av.className = 'msg-av';
  av.textContent = initials(senderName);
  if (!isMine) av.style.background = 'linear-gradient(135deg,#667eea,#764ba2)';

  // Bubble group
  const group = document.createElement('div');
  group.className = 'msg-group';

  if (!consecutive) {
    const meta = document.createElement('div');
    meta.className = 'msg-meta';
    meta.innerHTML = `<span class="msg-name">${esc(senderName)}</span><span class="msg-time">${esc(timeStr)}</span>`;
    group.appendChild(meta);
  }

  if (msg.imageUrl) {
    const wrap = document.createElement('div');
    wrap.className = 'bubble-img';
    wrap.innerHTML = `<img src="${esc(msg.imageUrl)}" alt="image" loading="lazy">`;
    wrap.querySelector('img').addEventListener('click', () => {
      document.getElementById('dc_lbImg').src = msg.imageUrl;
      document.getElementById('dc_lightbox').classList.add('open');
    });
    group.appendChild(wrap);
  } else if (msg.content) {
    const bubble = document.createElement('div');
    bubble.className = 'bubble';
    bubble.textContent = msg.content;
    group.appendChild(bubble);
  } else {
    return; // nothing to show
  }

  row.appendChild(av);
  row.appendChild(group);
  feed.appendChild(row);
  if (!bulk) scrollBottom();
}

function appendSys(text) {
  const feed = document.getElementById('dc_msgFeed');
  const div = document.createElement('div');
  div.className = 'sys-text';
  div.textContent = text;
  feed.appendChild(div);
  scrollBottom();
}

function scrollBottom() {
  const f = document.getElementById('dc_msgFeed');
  f.scrollTop = f.scrollHeight;
}

/* ─── Send message ─── */
function sendMsg() {
  const input = document.getElementById('dc_chatInput');
  const content = input.value.trim();
  if (!content) return;
  input.value = '';
  input.style.height = 'auto';
  stopTyping();
  const optimistic = {
    userId: user.userId, name: user.name,
    content, timestamp: new Date().toISOString(),
  };
  appendMsg(optimistic, false);
  wsSend({ type: 'chat', roomId: wsRoom, content });
}

/* ─── Image upload & send ─── */
document.getElementById('dc_imgInput').addEventListener('change', async (e) => {
  const files = Array.from(e.target.files || []);
  e.target.value = '';
  for (const file of files) {
    if (!file.type.startsWith('image/')) continue;
    try {
      const fd = new FormData();
      fd.append('image', file);
      const res = await fetch('/api/upload/image', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + user.token },
        body: fd,
      });
      if (!res.ok) throw new Error('upload failed');
      const data = await res.json();
      const url = data.url || data.imageUrl || '';
      if (url) {
        appendMsg({ userId: user.userId, name: user.name, imageUrl: url, timestamp: new Date().toISOString() });
        wsSend({ type: 'chat', roomId: wsRoom, imageUrl: url });
      }
    } catch (err) {
      appendSys('⚠️ ส่งรูปไม่สำเร็จ: ' + err.message);
    }
  }
});

/* ─── Input events ─── */
const chatInput = document.getElementById('dc_chatInput');
chatInput.addEventListener('input', () => {
  chatInput.style.height = 'auto';
  chatInput.style.height = Math.min(chatInput.scrollHeight, 100) + 'px';
  startTyping();
});
chatInput.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMsg(); }
});
document.getElementById('dc_sendBtn').addEventListener('click', sendMsg);

/* ─── Lightbox close on backdrop ─── */
document.getElementById('dc_lightbox').addEventListener('click', (e) => {
  if (e.target.id === 'dc_lightbox') e.target.classList.remove('open');
});
document.addEventListener('keydown', (e) => {
  if (e.key === 'Escape') document.getElementById('dc_lightbox').classList.remove('open');
});

/* ─── Boot ─── */
openChat();
</script>
