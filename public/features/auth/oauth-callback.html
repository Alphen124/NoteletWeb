<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Notelet — Signing in...</title>
  <style>
    body {
      background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'Inter', sans-serif;
      margin: 0;
    }
    .card {
      background: #fff;
      border-radius: 16px;
      padding: 48px 40px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.2);
      max-width: 360px;
      width: 100%;
    }
    .spinner {
      width: 48px;
      height: 48px;
      border: 4px solid #e0e0e0;
      border-top-color: #667eea;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 24px;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    h2 { margin: 0 0 8px; color: #1a1a2e; font-size: 1.4rem; }
    p  { margin: 0; color: #666; font-size: 0.95rem; }
    .error { color: #e53e3e; margin-top: 16px; font-size: 0.9rem; }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner" id="spinner"></div>
    <h2>Signing you in...</h2>
    <p>Please wait a moment.</p>
    <p class="error" id="errorMsg"></p>
  </div>

  <script>
    (function () {
      const params = new URLSearchParams(window.location.search);
      const error = params.get('error');
      if (error) {
        document.getElementById('spinner').style.display = 'none';
        document.querySelector('h2').textContent = 'Sign-in failed';
        document.querySelector('p').textContent = '';
        document.getElementById('errorMsg').textContent = decodeURIComponent(error);
        setTimeout(() => { window.location.href = '/features/auth/login.html'; }, 3000);
        return;
      }

      const data = params.get('data');
      if (!data) {
        window.location.href = '/features/auth/login.html?error=No+auth+data+received';
        return;
      }

      try {
        const json = JSON.parse(atob(data));
        localStorage.setItem('access_token', json.access_token);
        localStorage.setItem('refresh_token', json.refresh_token);
        localStorage.setItem('user', JSON.stringify(json.user));
        window.location.href = '/';
      } catch (e) {
        window.location.href = '/features/auth/login.html?error=Failed+to+process+login';
      }
    })();
  </script>
</body>
</html>
