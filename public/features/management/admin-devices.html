<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Notelet — จัดการอุปกรณ์ (Admin)</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <script src="/js/config.js"></script>
  <script src="/js/auth.js"></script>
  <style>
    :root { --blue:#043873; --accent:#FFE492; --primary:#4F9CF9; }
    body { background: #f4f6fa; font-family: 'Inter', sans-serif; }
    .admin-header { background: var(--blue); color: #fff; padding: 0; box-shadow: 0 2px 8px rgba(2,10,22,0.15); position: sticky; top: 0; z-index: 50; }
    .admin-header-inner { max-width: 1300px; margin: 0 auto; padding: 0 24px; height: 72px; display: flex; align-items: center; justify-content: space-between; }
    .admin-brand { display: flex; align-items: center; gap: 14px; text-decoration: none; }
    .admin-logo-mark { width: 46px; height: 46px; background-image: url('/logo.png'); background-size: cover; background-position: center; border-radius: 10px; }
    .admin-logo-text { font-size: 20px; font-weight: 800; color: #fff; letter-spacing: .6px; }
    .admin-badge { background: var(--accent); color: var(--blue); font-size: 11px; font-weight: 800; padding: 3px 10px; border-radius: 20px; letter-spacing: .6px; }
    .admin-user-info { display: flex; align-items: center; gap: 14px; }
    .admin-email { font-size: 13px; color: rgba(255,255,255,.75); }
    .btn-logout { background: rgba(255,255,255,.1); color: #fff; border: 1px solid rgba(255,255,255,.25); border-radius: 8px; padding: 8px 18px; font-size: 13px; font-weight: 600; cursor: pointer; transition: background .2s; }
    .btn-logout:hover { background: rgba(255,255,255,.2); }
    .admin-nav { background: #032d5c; border-top: 1px solid rgba(255,255,255,.08); }
    .admin-nav-inner { max-width: 1300px; margin: 0 auto; padding: 0 24px; display: flex; gap: 0; }
    .admin-nav a { color: rgba(255,255,255,.65); text-decoration: none; padding: 13px 20px; font-size: 14px; font-weight: 500; border-bottom: 3px solid transparent; transition: color .15s, border-color .15s; white-space: nowrap; }
    .admin-nav a:hover { color: #fff; border-bottom-color: var(--primary); }
    .admin-nav a.active { color: var(--accent); border-bottom-color: var(--accent); font-weight: 700; }
    .admin-content { max-width: 1300px; margin: 0 auto; padding: 40px 24px; }
    .page-title { font-size: 26px; font-weight: 800; color: #0d1b2e; margin: 0 0 4px; }
    .page-sub { color: #6b7a99; font-size: 14px; margin: 0 0 24px; }
    .toolbar { display: flex; gap: 12px; align-items: center; margin-bottom: 20px; flex-wrap: wrap; }
    .search-box { flex: 1; min-width: 200px; padding: 10px 16px; border: 1.5px solid #dbe4f5; border-radius: 10px; font-size: 14px; outline: none; transition: border-color .15s; background: #fff; }
    .search-box:focus { border-color: var(--primary); }
    .filter-select { padding: 10px 14px; border: 1.5px solid #dbe4f5; border-radius: 10px; font-size: 14px; outline: none; background: #fff; cursor: pointer; }
    .filter-select:focus { border-color: var(--primary); }
    .table-wrap { background: #fff; border-radius: 16px; box-shadow: 0 2px 12px rgba(4,56,115,0.08); overflow: auto; border: 1.5px solid #e4edfc; }
    table { width: 100%; border-collapse: collapse; min-width: 800px; }
    thead th { background: #f0f6ff; padding: 14px 14px; text-align: left; font-size: 12px; font-weight: 700; color: #4a6fa8; text-transform: uppercase; letter-spacing: .4px; border-bottom: 1.5px solid #dbe4f5; }
    tbody tr { border-bottom: 1px solid #f0f6ff; transition: background .1s; }
    tbody tr:hover { background: #f5f9ff; }
    tbody td { padding: 12px 14px; font-size: 14px; color: #1e293b; vertical-align: middle; }
    .device-img { width: 48px; height: 40px; object-fit: cover; border-radius: 8px; background: #e4edfc; }
    .status-chip { font-size: 11px; font-weight: 700; padding: 3px 10px; border-radius: 20px; letter-spacing: .3px; }
    .s-available { background: #d1fae5; color: #065f46; }
    .s-rented { background: #fef3c7; color: #92400e; }
    .s-other { background: #e0edff; color: #043873; }
    .btn-sm { padding: 6px 13px; border-radius: 7px; font-size: 12px; font-weight: 600; cursor: pointer; border: none; transition: opacity .15s, transform .1s; }
    .btn-sm:hover { opacity: .85; transform: translateY(-1px); }
    .btn-edit { background: var(--primary); color: #fff; }
    .btn-del { background: #ef4444; color: #fff; }
    .actions-cell { display: flex; gap: 6px; flex-wrap: wrap; }
    .modal-overlay { position: fixed; inset: 0; background: rgba(4,56,115,0.45); z-index: 8000; display: flex; align-items: center; justify-content: center; padding: 20px; }
    .modal-overlay.hidden { display: none; }
    .modal-box { background: #fff; border-radius: 20px; padding: 36px; width: 100%; max-width: 460px; box-shadow: 0 24px 48px rgba(4,56,115,0.18); }
    .modal-title { font-size: 18px; font-weight: 800; color: #0d1b2e; margin: 0 0 24px; }
    .form-group { margin-bottom: 18px; }
    .form-group label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 6px; }
    .form-group input, .form-group select, .form-group textarea { width: 100%; padding: 10px 14px; border: 1.5px solid #dbe4f5; border-radius: 10px; font-size: 14px; outline: none; font-family: inherit; transition: border-color .15s; box-sizing: border-box; }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--primary); }
    .modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }
    .btn-primary { background: var(--blue); color: #fff; border: none; border-radius: 10px; padding: 10px 24px; font-size: 14px; font-weight: 600; cursor: pointer; transition: background .2s; }
    .btn-primary:hover { background: #032d5c; }
    .btn-secondary { background: #f0f6ff; color: #043873; border: none; border-radius: 10px; padding: 10px 20px; font-size: 14px; font-weight: 600; cursor: pointer; }
    #loadingOverlay { position: fixed; inset: 0; background: rgba(255,255,255,.92); display: flex; align-items: center; justify-content: center; z-index: 9999; font-size: 16px; color: #6b7a99; }
    .loading-dot { animation: blink 1.2s infinite; }
    @keyframes blink { 0%,100%{opacity:.3} 50%{opacity:1} }
    .toast { position: fixed; bottom: 24px; right: 24px; background: var(--blue); color: #fff; padding: 12px 24px; border-radius: 12px; font-size: 14px; z-index: 9999; opacity: 0; transform: translateY(10px); transition: opacity .25s, transform .25s; pointer-events: none; }
    .toast.show { opacity: 1; transform: translateY(0); }
  </style>
</head>
<body>
<div id="loadingOverlay"><span class="loading-dot">กำลังโหลด...</span></div>
<div class="toast" id="toast"></div>
<div class="modal-overlay hidden" id="editModal">
  <div class="modal-box">
    <h2 class="modal-title">✏️ แก้ไขอุปกรณ์</h2>
    <input type="hidden" id="editDeviceId">
    <div class="form-group"><label>ชื่ออุปกรณ์</label><input type="text" id="editName" placeholder="ชื่ออุปกรณ์"></div>
    <div class="form-group"><label>คำอธิบาย</label><textarea id="editDesc" rows="3" placeholder="คำอธิบาย (ไม่บังคับ)"></textarea></div>
    <div class="form-group"><label>ราคาเช่า (บาท/วัน)</label><input type="number" id="editPrice" min="0" step="0.01" placeholder="0"></div>
    <div class="form-group">
      <label>สถานะ</label>
      <select id="editStatus">
        <option value="">— ไม่เปลี่ยน —</option>
        <option value="Available">Available</option>
        <option value="Reserved">Reserved</option>
        <option value="Rented">Rented</option>
        <option value="Delivered">Delivered</option>
        <option value="Returned">Returned</option>
        <option value="Overdue">Overdue</option>
        <option value="unavailable">Unavailable</option>
      </select>
    </div>
    <div class="modal-actions">
      <button class="btn-secondary" onclick="closeEditModal()">ยกเลิก</button>
      <button class="btn-primary" onclick="saveEdit()">บันทึก</button>
    </div>
  </div>
</div>
<header class="admin-header">
  <div class="admin-header-inner">
    <a class="admin-brand" href="/features/management/admin-dashboard.html">
      <div class="admin-logo-mark"></div>
      <span class="admin-logo-text">NOTELET</span>
      <span class="admin-badge">ADMIN</span>
    </a>
    <div class="admin-user-info">
      <span class="admin-email" id="adminEmail">—</span>
      <button class="btn-logout" onclick="logout()">ออกจากระบบ</button>
    </div>
  </div>
</header>
<nav class="admin-nav">
  <div class="admin-nav-inner">
    <a href="/features/management/admin-dashboard.html">📊 ภาพรวม</a>
    <a href="/features/management/admin-users.html">👥 จัดการผู้ใช้</a>
    <a href="/features/management/admin-devices.html" class="active">🖥️ จัดการอุปกรณ์</a>
    <a href="/features/management/admin-rentals.html">📋 คำขอเช่า</a>
    <a href="/index.html">← กลับหน้าหลัก</a>
  </div>
</nav>
<main class="admin-content">
  <h1 class="page-title">จัดการอุปกรณ์</h1>
  <p class="page-sub">ดู แก้ไข และลบอุปกรณ์ทั้งหมดในระบบ</p>
  <div class="toolbar">
    <input type="text" class="search-box" id="searchInput" placeholder="ค้นหาชื่ออุปกรณ์ หรือเจ้าของ..." oninput="renderTable()">
    <select class="filter-select" id="statusFilter" onchange="renderTable()">
      <option value="">ทุกสถานะ</option>
      <option value="Available">Available</option>
      <option value="Rented">Rented</option>
      <option value="Reserved">Reserved</option>
      <option value="unavailable">Unavailable</option>
    </select>
    <select class="filter-select" id="typeFilter" onchange="renderTable()">
      <option value="">ทุกประเภท</option>
    </select>
  </div>
  <div class="table-wrap">
    <table>
      <thead>
        <tr><th>รูป</th><th>ID</th><th>ชื่ออุปกรณ์</th><th>ประเภท</th><th>ราคา</th><th>สถานะ</th><th>เจ้าของ</th><th>วันที่เพิ่ม</th><th>การดำเนินการ</th></tr>
      </thead>
      <tbody id="devicesBody">
        <tr><td colspan="9" style="text-align:center;padding:40px;color:#94a3b8;">กำลังโหลด...</td></tr>
      </tbody>
    </table>
  </div>
</main>
<script>
let allDevices = [];
(async function init() {
  if (!isAuthenticated()) { window.location.href = '/features/auth/login.html'; return; }
  const user = getUserData();
  if (!user?.is_admin) { alert('คุณไม่มีสิทธิ์เข้าถึงหน้านี้'); window.location.href = '/index.html'; return; }
  document.getElementById('adminEmail').textContent = user.email || '—';
  document.getElementById('loadingOverlay').style.display = 'none';
  await loadDevices();
})();
async function loadDevices() {
  try {
    const res = await apiRequest('/api/admin/devices');
    allDevices = res.data ?? [];
    populateTypeFilter();
    renderTable();
  } catch (e) {
    document.getElementById('devicesBody').innerHTML = '<tr><td colspan="9" style="text-align:center;color:#ef4444;padding:40px;">โหลดข้อมูลไม่สำเร็จ</td></tr>';
  }
}
function populateTypeFilter() {
  const types = [...new Set(allDevices.map(d => d.type).filter(Boolean))];
  const sel = document.getElementById('typeFilter');
  sel.innerHTML = '<option value="">ทุกประเภท</option>' + types.map(t => `<option value="${escHtml(t)}">${escHtml(t)}</option>`).join('');
}
function renderTable() {
  const q = document.getElementById('searchInput').value.toLowerCase();
  const status = document.getElementById('statusFilter').value;
  const type = document.getElementById('typeFilter').value;
  const filtered = allDevices.filter(d => {
    const matchQ = !q || d.name.toLowerCase().includes(q) || d.owner_name.toLowerCase().includes(q) || d.owner_email.toLowerCase().includes(q);
    const matchS = !status || d.status === status;
    const matchT = !type || d.type === type;
    return matchQ && matchS && matchT;
  });
  if (!filtered.length) {
    document.getElementById('devicesBody').innerHTML = '<tr><td colspan="9" style="text-align:center;padding:32px;color:#94a3b8;">ไม่พบอุปกรณ์</td></tr>';
    return;
  }
  document.getElementById('devicesBody').innerHTML = filtered.map(d => {
    const imgTag = d.image_url ? `<img src="${escHtml(d.image_url)}" class="device-img" alt="" onerror="this.style.display='none'">` : `<div class="device-img" style="display:flex;align-items:center;justify-content:center;font-size:20px;">🖥️</div>`;
    const statusLower = (d.status ?? '').toLowerCase();
    let chipClass = 's-other';
    if (statusLower === 'available') chipClass = 's-available';
    else if (statusLower === 'rented' || statusLower === 'rental active') chipClass = 's-rented';
    const priceLabel = d.price > 0 ? `฿${Number(d.price).toLocaleString()}` : 'ฟรี';
    return `<tr>
      <td>${imgTag}</td>
      <td style="color:#6b7a99">${d.device_no}</td>
      <td><strong>${escHtml(d.name)}</strong>${d.is_admin_device ? ' <span style="font-size:10px;background:#fff3cd;color:#7c4700;padding:2px 6px;border-radius:8px;font-weight:700;">คณะ</span>' : ''}</td>
      <td style="color:#6b7a99">${escHtml(d.type)}</td>
      <td>${priceLabel}</td>
      <td><span class="status-chip ${chipClass}">${escHtml(d.status)}</span></td>
      <td><span style="font-weight:600">${escHtml(d.owner_name)}</span><br><small style="color:#94a3b8">${escHtml(d.owner_email)}</small></td>
      <td style="color:#6b7a99;font-size:13px">${d.created_at ?? '—'}</td>
      <td><div class="actions-cell">
        <button class="btn-sm btn-edit" onclick="openEdit(${d.device_no})">แก้ไข</button>
        <button class="btn-sm btn-del" onclick="deleteDevice(${d.device_no}, '${escHtml(d.name)}')">ลบ</button>
      </div></td>
    </tr>`;
  }).join('');
}
function openEdit(deviceId) {
  const d = allDevices.find(x => x.device_no === deviceId);
  if (!d) return;
  document.getElementById('editDeviceId').value = deviceId;
  document.getElementById('editName').value = d.name;
  document.getElementById('editDesc').value = '';
  document.getElementById('editPrice').value = d.price ?? 0;
  document.getElementById('editStatus').value = d.status ?? '';
  document.getElementById('editModal').classList.remove('hidden');
}
function closeEditModal() { document.getElementById('editModal').classList.add('hidden'); }
async function saveEdit() {
  const deviceId = document.getElementById('editDeviceId').value;
  const body = { name: document.getElementById('editName').value.trim(), description: document.getElementById('editDesc').value.trim(), price: parseFloat(document.getElementById('editPrice').value) || 0, status: document.getElementById('editStatus').value };
  try {
    await apiRequest(`/api/admin/devices/${deviceId}`, { method: 'PUT', body: JSON.stringify(body) });
    showToast('แก้ไขอุปกรณ์สำเร็จ');
    closeEditModal();
    await loadDevices();
  } catch (e) { showToast('เกิดข้อผิดพลาด: ' + (e.message ?? ''), true); }
}
async function deleteDevice(deviceId, name) {
  if (!confirm(`ยืนยันลบอุปกรณ์ "${name}"?\nการดำเนินการนี้ไม่สามารถยกเลิกได้`)) return;
  try {
    await apiRequest(`/api/admin/devices/${deviceId}`, { method: 'DELETE' });
    showToast('ลบอุปกรณ์สำเร็จ');
    await loadDevices();
  } catch { showToast('เกิดข้อผิดพลาด', true); }
}
function showToast(msg, isErr = false) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.background = isErr ? '#ef4444' : '#043873';
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2800);
}
function escHtml(s) { return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function logout() { clearAuthData(); window.location.href = '/features/auth/login.html'; }
document.getElementById('editModal').addEventListener('click', function(e) { if (e.target === this) closeEditModal(); });
</script>
</body>
</html>
